options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - 'build'
      - 'gcr.io/crypto-alert-479023/github.com/kenji888knymec/ocho:${BUILD_ID}'
      - '--builder'
      - 'gcr.io/buildpacks/builder'
      - '--publish'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'crypto-alert'
      - '--project'
      - 'crypto-alert-479023'
      - '--region'
      - 'asia-northeast1'
      - '--image'
      - 'gcr.io/crypto-alert-479023/github.com/kenji888knymec/ocho:${BUILD_ID}'
      - '--labels=commit-sha=${COMMIT_SHA},gcb-build-id=${BUILD_ID},gcb-trigger-id=448e2ab0-06bf-4441-9e99-688367b3d27d,deploy-trigger=crypto-alert-deploy-main'
      - '--update-env-vars'
      - 'DEPLOY_SHA=${COMMIT_SHA}'
      - '--quiet'
